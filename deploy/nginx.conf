events { worker_connections 1024; }
http {
  # Only Caddy publishes ports. Do not publish the gateway/API ports.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 10.0.0.0/8;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  limit_conn_zone $binary_remote_addr zone=connections:10m;
  server_tokens off;
  # No query strings or access tokens in access logs.
  log_format safe '$time_iso8601 $request_method $status $request_time';
  access_log /var/log/nginx/access.log safe;
  server {
    listen 8080;
    client_max_body_size 5m;
    client_body_timeout 15s;
    location /api/ {
      limit_req zone=api burst=30 nodelay;
      limit_req_status 429;
      limit_conn connections 20;
      proxy_pass http://api:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 35s;
    }
    location = /health/ready { proxy_pass http://api:8000; }
    location / {
      proxy_pass http://frontend:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 35s;
    }
  }
}
