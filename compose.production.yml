name: feedforward
services:
  api:
    image: feedforward-api:local
    build: ./backend
    restart: unless-stopped
    environment: &backend_environment
      ENVIRONMENT: production
      SUPABASE_URL: ${VITE_SUPABASE_URL:?Set Supabase URL}
      SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:?Set publishable key}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set backend secret key}
      FRONTEND_ORIGINS: https://${DOMAIN:?Set public domain}
    read_only: true
    tmpfs: [/tmp:size=64m]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 1.0
    logging: &logs
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  maintenance:
    image: feedforward-api:local
    build: ./backend
    restart: unless-stopped
    command: [python, -m, app.maintenance]
    environment: *backend_environment
    read_only: true
    tmpfs: [/tmp:size=16m]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    healthcheck:
      test: [CMD, python, -c, "import time,pathlib; p=pathlib.Path('/tmp/feedforward-maintenance.heartbeat'); assert p.exists() and time.time()-float(p.read_text())<180"]
      interval: 60s
      timeout: 5s
      start_period: 90s
    logging: *logs
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_OLA_MAPS_API_KEY: ${VITE_OLA_MAPS_API_KEY:-}
        VITE_API_URL: https://${DOMAIN}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp:size=64m]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    logging: *logs
  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes: [./deploy/nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on:
      api: {condition: service_healthy}
      frontend: {condition: service_healthy}
    logging: *logs
  tls:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [gateway]
    logging: *logs
volumes:
  caddy_data:
  caddy_config:
